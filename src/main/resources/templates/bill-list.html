<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Bills')"></head>
<body>
<nav th:replace="fragments/layout :: navbar"></nav>

<div class="container pb-5">

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <!-- Search -->
    <div class="card mb-4">
        <div class="card-header"><i class="bi bi-search me-1"></i> Search Bills</div>
        <div class="card-body">
            <form th:action="@{/bills}" method="get" class="row g-2 align-items-end">
                <div class="col-6 col-md-2">
                    <label class="form-label">Bill No.</label>
                    <input type="number" name="billNo" class="form-control"
                           th:value="${billNo}" placeholder="184"/>
                </div>
                <div class="col-6 col-md-3">
                    <label class="form-label">Seller Name</label>
                    <input type="text" name="sellerName" class="form-control"
                           th:value="${sellerName}" placeholder="Ravi Kumar..."/>
                </div>
                <div class="col-6 col-md-2">
                    <label class="form-label">From</label>
                    <input type="text" name="fromDate" class="form-control"
                           th:value="${fromDate}" placeholder="DD-MM-YYYY"/>
                </div>
                <div class="col-6 col-md-2">
                    <label class="form-label">To</label>
                    <input type="text" name="toDate" class="form-control"
                           th:value="${toDate}" placeholder="DD-MM-YYYY"/>
                </div>
                <div class="col-12 col-md-auto d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-search"></i> Search
                    </button>
                    <a th:href="@{/bills}" class="btn btn-secondary">Clear</a>
                    <a th:href="@{/bills/new}" class="btn btn-outline-primary ms-1">
                        <i class="bi bi-plus-circle"></i> New Bill
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Results -->
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span>Bills
                <span class="badge ms-1" style="background:var(--red2)"
                      th:text="${bills.totalElements}"></span>
            </span>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                    <tr>
                        <th>Bill No.</th>
                        <th>Date</th>
                        <th>Seller (Name)</th>
                        <th class="text-end">Brokerage (₹)</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${bills.empty}">
                        <td colspan="5" class="text-center text-muted py-5">
                            No bills found.
                        </td>
                    </tr>
                    <tr th:each="bill : ${bills.content}">
                        <td><strong th:text="${bill.billNo}"></strong></td>
                        <td th:text="${#temporals.format(bill.billDate,'dd-MM-yyyy')}"></td>
                        <td th:text="${bill.seller.name}"></td>
                        <td class="text-end fw-semibold"
                            th:text="'₹ ' + ${#numbers.formatDecimal(bill.totalAmount,1,2)}">
                        </td>
                        <td class="d-flex gap-1">
                            <a th:href="@{/bills/{id}(id=${bill.id})}"
                               class="btn btn-sm btn-outline-primary">View</a>
                            <a th:href="@{/bills/{id}/edit(id=${bill.id})}"
                               class="btn btn-sm btn-outline-secondary">Edit</a>
                            <a th:href="@{/bills/{id}/pdf(id=${bill.id})}"
                               class="btn btn-sm btn-outline-danger" target="_blank"
                               title="Download PDF">📄</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Pagination -->
        <div class="card-footer" th:if="${bills.totalPages > 1}">
            <nav>
                <ul class="pagination pagination-sm mb-0 justify-content-center">
                    <li class="page-item" th:classappend="${bills.first}?'disabled'">
                        <a class="page-link"
                           th:href="@{/bills(page=${bills.number-1},sellerName=${sellerName})}">‹</a>
                    </li>
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, bills.totalPages - 1)}"
                        th:classappend="${i==bills.number}?'active'">
                        <a class="page-link"
                           th:href="@{/bills(page=${i},sellerName=${sellerName})}"
                           th:text="${i+1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${bills.last}?'disabled'">
                        <a class="page-link"
                           th:href="@{/bills(page=${bills.number+1},sellerName=${sellerName})}">›</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
