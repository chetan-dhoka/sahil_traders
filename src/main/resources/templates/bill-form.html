<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Bill Form')"></head>
<body>
<nav th:replace="fragments/layout :: navbar"></nav>

<div class="container pb-5" style="max-width:1000px">

    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span th:text="${isNew} ? '📝 New Bill' : '✏️ Edit Bill #' + ${billNo}">Bill</span>
            <a th:href="@{/bills}" class="btn btn-sm btn-light">← Back</a>
        </div>
        <div class="card-body">

            <form th:action="${isNew} ? @{/bills/new} : @{/bills/{id}/edit(id=${billId})}"
                  th:object="${form}" method="post" id="billForm" novalidate="novalidate">

                <input type="hidden" th:field="*{firmId}"/>

                <!-- Error summary - MUST be inside form tag -->
                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger py-2">
                    <strong>Please fix the following:</strong>
                    <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
                </div>

                <!-- Same kind of message, produced by the page before saving -->
                <div id="clientErrors" class="alert alert-danger py-2 d-none"></div>

                <!-- Header Row -->
                <div class="row g-3 mb-3">
                    <div class="col-md-3">
                        <label class="form-label">Bill Date *</label>
                        <input type="text"
                               th:field="*{billDate}"
                               class="form-control"
                               placeholder="DD-MM-YYYY"
                               autocomplete="off"
                               th:classappend="${#fields.hasErrors('billDate')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{billDate}"></div>
                    </div>
                    <div class="col-md-9">
                        <label class="form-label">Seller Name (Name on bill) *</label>
                        <div class="position-relative">
                            <input type="text"
                                   th:field="*{sellerName}"
                                   class="form-control ac-input"
                                   data-url="/api/sellers/suggest"
                                   placeholder="Type seller name..."
                                   autocomplete="off"
                                   th:classappend="${#fields.hasErrors('sellerName')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:errors="*{sellerName}"></div>
                            <ul class="ac-list d-none list-unstyled mb-0"></ul>
                        </div>
                    </div>
                </div>

                <!-- Items Table -->
                <div class="table-responsive">
                    <table class="table table-bordered align-middle" id="itemsTable">
                        <thead>
                        <tr>
                            <th style="width:120px">Date</th>
                            <th>Particulars (Buyer)</th>
                            <th style="width:130px">Type (Material)</th>
                            <th style="width:75px">Qty<br/><small class="fw-normal text-muted">bags</small></th>
                            <th style="width:90px">Rate</th>
                            <th style="width:105px">Amount (Rs)</th>
                            <th style="width:42px"></th>
                        </tr>
                        </thead>
                        <tbody id="itemsBody">
                        <tr th:each="item, stat : *{items}">
                            <td>
                                <input type="text"
                                       th:name="'items[' + ${stat.index} + '].itemDate'"
                                       th:value="${item.itemDate}"
                                       class="form-control form-control-sm"
                                       placeholder="DD-MM-YYYY"
                                       autocomplete="off"/>
                            </td>
                            <td class="position-relative">
                                <input type="text"
                                       th:name="'items[' + ${stat.index} + '].buyerName'"
                                       th:value="${item.buyerName}"
                                       class="form-control form-control-sm ac-input"
                                       data-url="/api/buyers/suggest"
                                       placeholder="Buyer name..."
                                       autocomplete="off"/>
                                <ul class="ac-list d-none list-unstyled mb-0"></ul>
                            </td>
                            <td>
                                <input type="text"
                                       th:name="'items[' + ${stat.index} + '].materialType'"
                                       th:value="${item.materialType}"
                                       class="form-control form-control-sm"
                                       placeholder="Wheat, Rice..."/>
                            </td>
                            <td>
                                <input type="number"
                                       th:name="'items[' + ${stat.index} + '].qty'"
                                       th:value="${item.qty}"
                                       class="form-control form-control-sm qty-input"
                                       min="1"
                                       placeholder="0"/>
                            </td>
                            <td>
                                <input type="number"
                                       step="0.01"
                                       th:name="'items[' + ${stat.index} + '].rate'"
                                       th:value="${item.rate}"
                                       class="form-control form-control-sm rate-input"
                                       min="0"
                                       placeholder="0.00"/>
                            </td>
                            <td>
                                <input type="text"
                                       class="form-control form-control-sm amount-cell fw-semibold"
                                       readonly
                                       tabindex="-1"
                                       placeholder="0.00"/>
                            </td>
                            <td class="text-center">
                                <button type="button" tabindex="-1"
                                        class="btn btn-sm btn-outline-danger remove-row"
                                        title="Remove row">X</button>
                            </td>
                        </tr>
                        </tbody>
                        <tfoot>
                        <tr style="background:var(--tint3)">
                            <td colspan="5" class="text-end fw-bold" style="color:var(--red)">
                                Total Brokerage
                            </td>
                            <td>
                                <input type="text"
                                       id="grandTotal"
                                       class="form-control form-control-sm fw-bold"
                                       style="color:var(--red)"
                                       readonly/>
                            </td>
                            <td></td>
                        </tr>
                        </tfoot>
                    </table>
                </div>

                <!-- Items error - inside form -->
                <div th:if="${#fields.hasErrors('items')}" class="text-danger small mb-2">
                    Please add at least one complete row.
                </div>

                <!-- Action Buttons -->
                <div class="d-flex flex-wrap gap-2 mt-3">
                    <button type="button" id="addRow" class="btn btn-outline-primary btn-sm">
                        + Add Row
                    </button>
                    <button type="submit" class="btn btn-primary px-4">
                        <span th:text="${isNew} ? 'Save Bill' : 'Update Bill'"></span>
                    </button>
                    <a th:href="@{/bills}" class="btn btn-secondary">Cancel</a>
                </div>

            </form>
        </div>
    </div>
</div>

<!-- Delete-row confirmation -->
<div class="modal fade" id="deleteRowModal" tabindex="-1" aria-labelledby="deleteRowTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteRowTitle">Delete this row?</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p id="deleteRowSummary" class="mb-1 fw-semibold"></p>
                <p class="text-muted small mb-0">This removes the row from the bill form.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="deleteRowCancel" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" id="deleteRowConfirm">Delete row</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/bill-form.js}"></script>
</body>
</html>
