<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Reports')"></head>
<body>
<nav th:replace="fragments/layout :: navbar"></nav>

<div class="container pb-5">

    <!-- Filters -->
    <div class="card mb-4">
        <div class="card-header"><i class="bi bi-funnel-fill me-1"></i> Report Filters</div>
        <div class="card-body">
            <form th:action="@{/reports}" method="get" class="row g-3 align-items-end">

                <div class="col-6 col-md-2">
                    <label class="form-label">Period</label>
                    <select name="period" class="form-select" id="periodSel">
                        <option value="yearly"  th:selected="${period=='yearly'}">Full Year</option>
                        <option value="h1"      th:selected="${period=='h1'}">H1 (Apr–Sep)</option>
                        <option value="h2"      th:selected="${period=='h2'}">H2 (Oct–Mar)</option>
                        <option value="q1"      th:selected="${period=='q1'}">Q1 (Apr–Jun)</option>
                        <option value="q2"      th:selected="${period=='q2'}">Q2 (Jul–Sep)</option>
                        <option value="q3"      th:selected="${period=='q3'}">Q3 (Oct–Dec)</option>
                        <option value="q4"      th:selected="${period=='q4'}">Q4 (Jan–Mar)</option>
                        <option value="custom"  th:selected="${period=='custom'}">Custom</option>
                    </select>
                </div>

                <div class="col-6 col-md-2" id="fyDiv">
                    <label class="form-label">FY Year</label>
                    <input type="number" name="fyYear" class="form-control"
                           th:value="${fyYear}" placeholder="e.g. 2024"/>
                </div>

                <div class="col-6 col-md-2 d-none" id="fromDiv">
                    <label class="form-label">From Date</label>
                    <input type="text" name="fromDate" class="form-control"
                           placeholder="DD-MM-YYYY"/>
                </div>
                <div class="col-6 col-md-2 d-none" id="toDiv">
                    <label class="form-label">To Date</label>
                    <input type="text" name="toDate" class="form-control"
                           placeholder="DD-MM-YYYY"/>
                </div>

                <div class="col-12 col-md-3">
                    <label class="form-label">Seller (optional)</label>
                    <select name="sellerId" class="form-select">
                        <option value="">— All Sellers —</option>
                        <option th:each="s : ${sellers}"
                                th:value="${s.id}"
                                th:text="${s.name}"
                                th:selected="${s.id == sellerId}">
                        </option>
                    </select>
                </div>

                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-bar-chart"></i> Generate
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Results -->
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
            <span>
                <i class="bi bi-table me-1"></i>
                <strong th:text="${rangeLabel}"></strong>
                &nbsp;(<span th:text="${fromDate}"></span> → <span th:text="${toDate}"></span>)
            </span>
            <div class="d-flex gap-2">
                <a th:href="@{/reports/pdf(period=${period},fyYear=${fyYear},sellerId=${sellerId})}"
                   class="btn btn-sm btn-danger">
                    <i class="bi bi-file-pdf-fill"></i> PDF
                </a>
                <a th:href="@{/reports/csv(period=${period},fyYear=${fyYear},sellerId=${sellerId})}"
                   class="btn btn-sm btn-success">
                    <i class="bi bi-file-earmark-spreadsheet"></i> CSV
                </a>
            </div>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                    <tr>
                        <th>Bill No.</th>
                        <th>Date</th>
                        <th>Seller</th>
                        <th class="text-end">Brokerage (₹)</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${bills.empty}">
                        <td colspan="5" class="text-center text-muted py-5">
                            No bills found for this period.
                        </td>
                    </tr>
                    <tr th:each="bill : ${bills}">
                        <td><strong th:text="${bill.billNo}"></strong></td>
                        <td th:text="${#temporals.format(bill.billDate,'dd-MM-yyyy')}"></td>
                        <td th:text="${bill.seller.name}"></td>
                        <td class="text-end fw-semibold"
                            th:text="'₹ ' + ${#numbers.formatDecimal(bill.totalAmount,1,2)}">
                        </td>
                        <td>
                            <a th:href="@{/bills/{id}(id=${bill.id})}"
                               class="btn btn-sm btn-outline-primary">View</a>
                        </td>
                    </tr>
                    </tbody>
                    <tfoot th:if="${!bills.empty}">
                    <tr style="background:var(--tint3)">
                        <td colspan="3" class="text-end fw-bold" style="color:var(--red)">
                            Grand Total (<span th:text="${bills.size()}"></span> bills)
                        </td>
                        <td class="text-end fw-bold fs-5" style="color:var(--red)"
                            th:text="'₹ ' + ${#numbers.formatDecimal(grandTotal,1,2)}">
                        </td>
                        <td></td>
                    </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const sel = document.getElementById('periodSel');
    const fyD = document.getElementById('fyDiv');
    const frD = document.getElementById('fromDiv');
    const toD = document.getElementById('toDiv');
    function toggle() {
        const isCustom = sel.value === 'custom';
        fyD.classList.toggle('d-none', isCustom);
        frD.classList.toggle('d-none', !isCustom);
        toD.classList.toggle('d-none', !isCustom);
    }
    sel.addEventListener('change', toggle);
    toggle();
</script>
</body>
</html>
