<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Settings')"></head>
<body>
<nav th:replace="fragments/layout :: navbar"></nav>

<div class="container pb-5" style="max-width:650px">

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card">
        <div class="card-header">⚙️ Firm Settings – <span th:text="${firm.firmName}"></span></div>
        <div class="card-body">
            <p class="text-muted small mb-3">
                These details appear on every printed PDF bill. Edit anytime.
            </p>
            <form th:action="@{/settings}" th:object="${firm}" method="post">
                <input type="hidden" th:field="*{id}"/>
                <div class="mb-3">
                    <label class="form-label">Firm Name</label>
                    <input type="text" th:field="*{firmName}" class="form-control"
                           placeholder="Sahil Traders"/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Subtitle</label>
                    <input type="text" th:field="*{subtitle}" class="form-control"
                           placeholder="Grain & Grocery Broker"/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Address</label>
                    <input type="text" th:field="*{address}" class="form-control"
                           placeholder="Anand Heights, Kondhwa, Pune 48."/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Mobile Number</label>
                    <input type="text" th:field="*{mobile}" class="form-control"
                           placeholder="9999999999"/>
                </div>
                <div class="mb-3">
                    <label class="form-label">PAN Number</label>
                    <input type="text" th:field="*{panNumber}" class="form-control"
                           placeholder="COHPC2282R"/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Footer Line 1 (Marathi / English)</label>
                    <input type="text" th:field="*{footerLine1}" class="form-control"
                           placeholder="चूकभूल देणे घेणे."/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Footer Line 2</label>
                    <input type="text" th:field="*{footerLine2}" class="form-control"
                           placeholder="व्यापारी संबंधात आम्ही फक्त साक्षीदार राहू."/>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Colour theme</label>
                        <select th:field="*{theme}" class="form-select">
                            <option th:each="t : ${themes}" th:value="${t.key}" th:text="${t.label}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Logo initials (used when no logo image)</label>
                        <input type="text" th:field="*{logoText}" class="form-control"
                               maxlength="4" placeholder="ST"/>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary px-4">
                    <i class="bi bi-save-fill"></i> Save Settings
                </button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
