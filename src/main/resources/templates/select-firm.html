<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Select Firm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&amp;family=DM+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'DM Sans', sans-serif; background: #f4f4f6; min-height: 100vh; }
        h1 { font-family: 'Baloo 2', sans-serif; font-weight: 800; color: #333; }
        .firm-card {
            background: #fff; border-radius: 14px; border: 2px solid transparent;
            box-shadow: 0 4px 16px rgba(0,0,0,.08); padding: 28px 20px; text-align: center;
            transition: transform .15s, box-shadow .15s;
        }
        .firm-card:hover { transform: translateY(-4px); box-shadow: 0 10px 26px rgba(0,0,0,.14); }
        .logo-circle {
            width: 92px; height: 92px; border-radius: 50%; margin: 0 auto 14px auto;
            color: #fff; font-weight: 800; font-size: 28px; line-height: 92px;
            font-family: 'Baloo 2', sans-serif;
        }
        .logo-img { width: 92px; height: 92px; border-radius: 50%; margin: 0 auto 14px auto; display: block; }
        .firm-name { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 1.35rem; }
        .firm-sub  { color: #777; font-size: .9rem; min-height: 1.4em; }
        .btn-open  { color: #fff; font-weight: 600; width: 100%; margin-top: 16px; border: none; padding: 10px; }
        .btn-open:hover { color: #fff; opacity: .9; }
    </style>
</head>
<body>
<div class="container py-5" style="max-width:820px">

    <div class="text-center mb-5">
        <h1>Select Firm</h1>
        <p class="text-muted mb-0">Choose the firm you want to work in.
            Everything you do next — bills, reports, PDFs — belongs to this firm only.</p>
    </div>

    <div class="row g-4 justify-content-center">
        <div class="col-12 col-sm-6" th:each="c : ${cards}">
            <form th:action="@{/select-firm}" method="post">
                <input type="hidden" name="firmId" th:value="${c.firm.id}"/>
                <div class="firm-card" th:style="'border-top: 6px solid ' + ${c.theme.primary}">

                    <img th:if="${c.firm.logoPath != null and !c.firm.logoPath.isEmpty()}"
                         th:src="@{${'/' + c.firm.logoPath}}" class="logo-img" alt=""/>
                    <div th:if="${c.firm.logoPath == null or c.firm.logoPath.isEmpty()}"
                         class="logo-circle"
                         th:style="'background:' + ${c.theme.primary}"
                         th:text="${c.firm.logoText}">ST</div>

                    <div class="firm-name" th:style="'color:' + ${c.theme.primary}"
                         th:text="${c.firm.firmName}">Firm</div>
                    <div class="firm-sub" th:text="${c.firm.subtitle}">Subtitle</div>

                    <button type="submit" class="btn btn-open"
                            th:style="'background:' + ${c.theme.primary}">
                        Open this firm &rarr;
                    </button>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
